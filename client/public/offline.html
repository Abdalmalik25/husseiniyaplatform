<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALHUSAINIA - غير متصل</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Cairo', 'Noto Kufi Arabic', sans-serif;
      background: #0d1b1c;
      color: #fbf8f2;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 400px;
      padding: 2rem;
    }
    .icon {
      width: 80px;
      height: 80px;
      background: #b87945;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      font-size: 2rem;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: #b87945;
    }
    p {
      color: #94a3b8;
      font-size: 0.875rem;
      line-height: 1.6;
    }
    .retry-btn {
      margin-top: 1.5rem;
      padding: 0.75rem 2rem;
      background: #b87945;
      color: #102a2b;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
    }
    .retry-btn:hover {
      background: #a06838;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">⚡</div>
    <h1>غير متصل بالإنترنت</h1>
    <p>الجهاز غير متصل حالياً. البيانات المحفوظة محلياً متاحة. سيتم مزامنة التغييرات عند عودة الاتصال.</p>
    <button class="retry-btn" onclick="location.reload()">إعادة المحاولة</button>
  </div>
</body>
</html>
