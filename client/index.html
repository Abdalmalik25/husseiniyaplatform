      <style>
        .alhusainia-splash {
          position: fixed;
          inset: 0;
          background: radial-gradient(

            #102627 0%,
            #091516 100%
          );
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          font-family:

          color: #f0ebe3;
          z-index: 9999;
          overflow: hidden;
        }
        .alhusainia-top-progress {
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          height: 3px;
          background: linear-gradient(
            90deg,
            #b87945,
            #e2b17a,
            #38bdf8,
            #b87945
          );
          background-size: 200% 100%;
          animation: alhusainia-slide 1.5s linear infinite;
        }
        .alhusainia-splash-card {
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
          gap: 10px;
          padding: 32px;
          border-radius: 28px;
          background: rgba(255, 255, 255, 0.02);
          border: 1px solid rgba(255, 255, 255, 0.06);
          backdrop-filter: blur(12px);
          box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
          max-width: 320px;
          width: 90%;
        }
        .alhusainia-emblem-wrap {
          position: relative;
          margin-bottom: 4px;
          animation: alhusainia-pulse 2s ease-in-out infinite;
        }
        .alhusainia-emblem {
          width: 52px;
          height: 52px;
          filter: drop-shadow(0 4px 12px rgba(184, 121, 69, 0.25));
        }
        .alhusainia-splash-title {
          font-weight: 900;
          font-size: 16px;
          color: #ffffff;
          letter-spacing: -0.2px;
        }
        .alhusainia-splash-sub {
          font-weight: 500;
          font-size: 11px;
          color: rgba(255, 255, 255, 0.5);
          letter-spacing: 0.5px;
          margin-top: -4px;
        }
        .alhusainia-progress-bar {
          width: 160px;
          height: 4px;
          background: rgba(255, 255, 255, 0.08);
          border-radius: 99px;
          overflow: hidden;
          margin-top: 10px;
          position: relative;
        }
        .alhusainia-progress-fill {
          position: absolute;
          top: 0;
          bottom: 0;
          left: 0;
          width: 50%;
          background: linear-gradient(90deg, #b87945, #e2b17a);
          border-radius: 99px;
          animation: alhusainia-indeterminate 1.4s
            cubic-bezier(0.65, 0.815, 0.735, 0.395) infinite;
        }
        .alhusainia-splash-status {
          font-size: 10px;
          color: #d4a574;
          font-weight: 600;
          letter-spacing: 0.3px;
        }
        @keyframes alhusainia-slide {
          0% {
            background-position: 100% 0;
          }
          100% {
            background-position: -100% 0;
          }
        }
        @keyframes alhusainia-pulse {
          0%,
          100% {
            transform: scale(1);
            opacity: 1;
          }
          50% {
            transform: scale(1.05);
            opacity: 0.9;
          }
        }
        @keyframes alhusainia-indeterminate {
          0% {
            left: -40%;
            width: 40%;
          }
          50% {
            left: 20%;
            width: 60%;
          }
          100% {
            left: 100%;
            width: 40%;
          }
        }
