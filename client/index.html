<!doctype html>
<html lang="ar" dir="rtl">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <title>ALHUSAINIA | نظام الحسينية المحاسبي المتقدم</title>
    <meta name="description" content="ALHUSAINIA — نظام محاسبي متكامل للمؤسسات والأعمال. إدارة الحسابات، المعاملات، التقارير، والتحليلات المالية بذكاء." />
    <meta name="theme-color" content="#102a2b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ALHUSAINIA" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <meta name="msapplication-TileColor" content="#102a2b" />
    <meta name="msapplication-TileImage" content="/icon-192.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Noto+Kufi+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root">
      <div class="alhusainia-splash">
        <div class="alhusainia-splash-logo">أ</div>
        <div class="alhusainia-splash-name">ALHUSAINIA | نظام الحسابات</div>
        <div class="alhusainia-splash-sub">مؤسسة الحسينية لخدمات الأعمال — جاري تجهيز المنصة…</div>
        <div class="alhusainia-splash-bar"><div class="alhusainia-splash-bar-fill"></div></div>
      </div>
      <style>
        .alhusainia-splash{position:fixed;inset:0;background:#0d1b1c;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#f0ebe3;z-index:9999}
        .alhusainia-splash-logo{width:56px;height:56px;border-radius:16px;background:#b87945;color:#102a2b;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px;box-shadow:0 8px 24px rgba(184,121,69,.35)}
        .alhusainia-splash-name{margin-top:14px;font-weight:700;font-size:15px;letter-spacing:.4px}
        .alhusainia-splash-sub{margin-top:6px;font-size:11px;color:#8fa3a4}
        .alhusainia-splash-bar{margin-top:18px;width:120px;height:3px;border-radius:2px;background:#274647;overflow:hidden}
        .alhusainia-splash-bar-fill{width:40%;height:100%;border-radius:2px;background:#b87945;animation:alhusainia-splashmove 1.1s ease-in-out infinite}
        @keyframes alhusainia-splashmove{0%{transform:translateX(-140px)}100%{transform:translateX(180px)}}
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
